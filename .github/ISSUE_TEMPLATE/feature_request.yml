name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述使用场景，而不是只给方案
      placeholder: 我在阅读 ... 时，希望 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 和 README
          required: true
